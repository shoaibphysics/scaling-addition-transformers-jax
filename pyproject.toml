[project]
name = "addition-transformers-jax"
version = "0.1.0"
description = "Addition Transformers in JAX with compute-scaling and capability-transition experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flax==0.12.9",
  "jax==0.11.1",
  "numpy>=2,<3",
  "optax==0.2.8",
  "orbax-checkpoint==0.12.4",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.10,<4",
  "scipy>=1.16,<2",
]

[project.scripts]
addition-transformer = "scaling_transformers_in_jax.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scaling_transformers_in_jax"
